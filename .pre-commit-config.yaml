# Pre-commit configuration
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
        # devcontainer.json is JSONC - comments are valid there per the
        # devcontainer spec, so a strict JSON parser rejects it
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: mixed-line-ending

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        # -x follows sourced files (_arch.sh); -S warning matches the CI lint
        # job exactly, so a clean run here means a clean run there
        args: ['-x', '-S', 'warning']
        # The home/ files are shell fragments sourced into an interactive
        # shell, not standalone scripts - no shebang, and deliberately full of
        # variables consumed by the shell rather than by them
        exclude: ^\.devcontainer/files/home/

  # Terraform checks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--framework terraform

  # NOTE: there is no ansible-lint hook here on purpose. This repository ships
  # Ansible inside the image but contains no playbooks or roles of its own, and
  # the hook's `files: \.(yaml|yml)$` pattern pointed it at the GitHub workflow
  # files, linting CI config as though it were Ansible. Add it back scoped to a
  # real playbook directory if one ever lands.

  # Python checks
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=88', '--extend-ignore=E203']

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      # Ignores come from .hadolint.yaml so this matches CI exactly
      - id: hadolint-docker

  # Markdown linting - rules in .markdownlint.json
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix']

  # YAML linting - rules in .yamllint.yaml, which yamllint auto-discovers
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Git commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

# Global settings
default_language_version:
  python: python3

# Exclude patterns
exclude: |
  (?x)^(
      .git/|
      .terraform/|
      .terragrunt-cache/|
      __pycache__/|
      node_modules/|
      .venv/|
      venv/
  )
